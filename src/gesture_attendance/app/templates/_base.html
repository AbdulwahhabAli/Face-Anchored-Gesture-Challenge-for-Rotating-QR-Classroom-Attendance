<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gesture attendance{% endblock %}</title>
<style>
  :root { --ink:#16202c; --muted:#5d6b7a; --line:#dde3ea; --bg:#f6f8fa; --ok:#127a3e; --okbg:#e3f5ea;
          --bad:#b42318; --badbg:#fdecea; --accent:#1f4fd1; --warn:#9a6700; --warnbg:#fff4d6; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { font-size:1.5rem; margin:0 0 12px; } h2 { font-size:1.1rem; margin:0 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .muted { color:var(--muted); font-size:.9rem; }
  button, .btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:9px 16px;
                 border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary, .btn.secondary { background:#fff; color:var(--accent); }
  button.danger { background:var(--bad); border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:.8rem; margin-right:3px; }
  .ok { background:var(--okbg); color:var(--ok); } .bad { background:var(--badbg); color:var(--bad); }
  .warn { background:var(--warnbg); color:var(--warn); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
